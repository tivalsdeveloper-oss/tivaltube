[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tivaltube"
version = "0.1.0"
description = "A friendly Python library and CLI for authorized YouTube downloads"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tivalsdeveloper" }]
keywords = ["youtube", "downloader", "video", "audio", "yt-dlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["yt-dlp>=2025.1.15"]

[project.urls]
Homepage = "https://github.com/tivalsdeveloper-oss/tivaltube"
Repository = "https://github.com/tivalsdeveloper-oss/tivaltube"
Issues = "https://github.com/tivalsdeveloper-oss/tivaltube/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
tivaltube = "tivaltube.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tivaltube"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

